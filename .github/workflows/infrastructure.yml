name: Terraform infrastructure

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: login-lab-terraform
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_admin_cidr: ${{ vars.TF_ADMIN_CIDR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "425034746374"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Check required configuration
        run: |
          set -euo pipefail
          test -n "$TF_VAR_admin_cidr"
          test -f login-lab.pub
          test -f .terraform.lock.hcl

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Plan infrastructure
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply infrastructure
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Show infrastructure outputs
        run: terraform output