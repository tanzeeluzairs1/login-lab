name: Build and deploy login lab

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/**"
      - "deploy/**"
      - ".gitattributes"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: login-lab-pipeline
  cancel-in-progress: false

jobs:
  infrastructure:
    uses: ./.github/workflows/infrastructure.yml

  build:
    needs: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "425034746374"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build both images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/login-lab-backend:$IMAGE_TAG" \
            ./backend

          docker build \
            -t "$REGISTRY/login-lab-frontend:$IMAGE_TAG" \
            ./frontend

      - name: Push both images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          docker push "$REGISTRY/login-lab-backend:$IMAGE_TAG"
          docker push "$REGISTRY/login-lab-frontend:$IMAGE_TAG"

          {
            echo "### Published images"
            echo "- Backend: \`$REGISTRY/login-lab-backend:$IMAGE_TAG\`"
            echo "- Frontend: \`$REGISTRY/login-lab-frontend:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [infrastructure, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "425034746374"

      - name: Deploy through Systems Manager
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import shlex
          import subprocess
          import time

          region = os.environ["AWS_REGION"]
          image_tag = os.environ["IMAGE_TAG"]

          def aws(*args):
              result = subprocess.run(
                  ["aws", *args, "--region", region,
                   "--output", "json", "--no-cli-pager"],
                  capture_output=True,
                  text=True,
                  timeout=60
              )
              if result.returncode != 0:
                  raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout)

          # Find the running instance belonging to this lab.
          response = aws(
              "ec2", "describe-instances",
              "--filters",
              "Name=tag:Project,Values=login-lab",
              "Name=tag:Name,Values=login-lab-app",
              "Name=instance-state-name,Values=running"
          )
          instances = [
              instance
              for reservation in response["Reservations"]
              for instance in reservation["Instances"]
          ]

          if len(instances) != 1:
              raise RuntimeError(
                  f"Expected one running lab instance; found {len(instances)}"
              )

          instance_id = instances[0]["InstanceId"]
          print(f"Deployment target: {instance_id}", flush=True)

          # Wait up to five minutes for SSM registration.
          for attempt in range(60):
              result = aws(
                  "ssm", "describe-instance-information",
                  "--filters", f"Key=InstanceIds,Values={instance_id}"
              )
              nodes = result["InstanceInformationList"]
              if nodes and nodes[0]["PingStatus"] == "Online":
                  break
              time.sleep(5)
          else:
              raise RuntimeError("Instance did not become Online in SSM")

          # Transfer only deployment code. EC2 retrieves its own password.
          commands = [
              "set -eu",
              "timeout 600 cloud-init status --wait",
              "test -f /var/lib/login-lab-bootstrap.done",
              "install -d -m 0755 /opt/login-lab",
              (
                  "if ! command -v aws >/dev/null 2>&1; then "
                  "curl -fsSL https://awscli.amazonaws.com/v2/install.sh "
                  "-o /opt/login-lab/aws-cli-install.sh; "
                  "bash /opt/login-lab/aws-cli-install.sh --system; "
                  "fi"
              )
          ]

          for filename in ["compose.ec2.yaml", "deploy.sh"]:
              content = pathlib.Path("deploy", filename).read_bytes()
              content = content.replace(b"\r\n", b"\n")
              encoded = base64.b64encode(content).decode("ascii")
              commands.append(
                  f"printf '%s' '{encoded}' | base64 --decode "
                  f"> /opt/login-lab/{filename}"
              )

          commands.extend([
              "chmod 0755 /opt/login-lab/deploy.sh",
              "bash /opt/login-lab/deploy.sh " + shlex.quote(image_tag)
          ])

          # Submit one shell script so any failed command stops deployment.
          payload = {
              "InstanceIds": [instance_id],
              "DocumentName": "AWS-RunShellScript",
              "Comment": "Deploy login-lab images " + image_tag,
              "TimeoutSeconds": 600,
              "Parameters": {
                  "commands": ["\n".join(commands)],
                  "executionTimeout": ["1200"]
              }
          }

          payload_path = pathlib.Path(
              os.environ["RUNNER_TEMP"], "login-lab-command.json"
          )
          payload_path.write_text(json.dumps(payload))

          result = aws(
              "ssm", "send-command",
              "--cli-input-json", "file://" + str(payload_path)
          )
          command_id = result["Command"]["CommandId"]
          print(f"SSM command: {command_id}", flush=True)

          # Wait for completion and report the remote command's result.
          for attempt in range(240):
              try:
                  invocation = aws(
                      "ssm", "get-command-invocation",
                      "--command-id", command_id,
                      "--instance-id", instance_id
                  )
              except RuntimeError as error:
                  if "InvocationDoesNotExist" in str(error):
                      time.sleep(5)
                      continue
                  raise

              status = invocation["Status"]
              if status in ["Pending", "InProgress", "Delayed"]:
                  time.sleep(5)
                  continue

              print(invocation.get("StandardOutputContent", ""))
              print(invocation.get("StandardErrorContent", ""))

              if status != "Success":
                  raise RuntimeError(f"Deployment failed: {status}")

              print("Deployment completed successfully.", flush=True)
              break
          else:
              raise RuntimeError(
                  "Stopped waiting for deployment; check SSM Run Command history"
              )
          PY