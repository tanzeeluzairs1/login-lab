name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/**"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    uses: ./.github/workflows/infrastructure.yml

  build:
    needs: infrastructure
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show OIDC subject
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:", claims["sub"])
          print("OIDC audience:", claims["aud"])
          PY

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "425034746374"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build both images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/login-lab-backend:$IMAGE_TAG" \
            ./backend

          docker build \
            -t "$REGISTRY/login-lab-frontend:$IMAGE_TAG" \
            ./frontend

      - name: Push both images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          docker push "$REGISTRY/login-lab-backend:$IMAGE_TAG"
          docker push "$REGISTRY/login-lab-frontend:$IMAGE_TAG"

          {
            echo "### Published images"
            echo "- Backend: \`$REGISTRY/login-lab-backend:$IMAGE_TAG\`"
            echo "- Frontend: \`$REGISTRY/login-lab-frontend:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"