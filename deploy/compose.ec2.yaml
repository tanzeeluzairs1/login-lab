name: login-lab

services:
  backend:
    image: "${REGISTRY:?Set REGISTRY}/login-lab-backend:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      APP_ORIGIN: "${APP_ORIGIN:?Set APP_ORIGIN}"
      DEMO_EMAIL: "tanzeel@example.com"
      DEMO_PASSWORD: "${DEMO_PASSWORD:?Set DEMO_PASSWORD}"
      COOKIE_SECURE: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: "${REGISTRY:?Set REGISTRY}/login-lab-frontend:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      BACKEND_URL: "http://backend:5000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"