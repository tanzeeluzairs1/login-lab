name: login-lab

services:
  backend:
    build: ./backend
    image: login-backend:v1
    env_file:
      - ./backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      APP_ORIGIN: "http://localhost:3000"
      COOKIE_SECURE: "false"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    image: login-frontend:v1
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      BACKEND_URL: "http://backend:5000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped